# llama-swap — m4pro (laptop, 48 GB)
#
# Loads on first request, unloads after ttl. Closing the lid stops the service
# and the router falls back to mini-thunder by itself.
# Start with: ./scripts/start-models.sh m4pro
#
# Budget: ~36 GB usable GPU memory (macOS caps ~75% of 48 GB by default).
#   Qwen3.5-35B-A3B Q4_K_M  ~20 GB weights
#   64k ctx, q8_0 KV        ~4-6 GB (A3B, hybrid MoE attention)
#   compute buffers         ~2 GB

healthCheckTimeout: 900    # 20 GB cold load, possibly a first-time download
logLevel: info
logToStdout: "proxy,http"
startPort: 10001
unloadTimeout: 15
globalTTL: 900             # unload 15 min after the last request
includeAliasesInList: true

macros:
  llama: ${env.LLAMA_SERVER_BIN}

models:
  qwen35-35b:
    name: "Qwen3.5 35B A3B (m4pro)"
    description: "Primary model. 64k context. Tool calling."
    cmd: |
      ${llama}
      -hf unsloth/Qwen3.5-35B-A3B-GGUF:Q4_K_M
      --jinja --no-mmproj
      -ngl 99
      -c 65536
      -fa on -ctk q8_0 -ctv q8_0
      --host 127.0.0.1 --port ${PORT}
    ttl: 900
    aliases:
      - big
    capabilities:
      context: 65536
      tools: true
      in: [text]
      out: [text]
